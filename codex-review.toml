# Python 3.13以上。モデルIDは利用するアカウントに合わせて変更する。
review_model = "gpt-6.1-sol"
fix_model = "gpt-6-luna"
base = "origin/main"
max_fixes = 3
codex_timeout = 900
check_timeout = 300
checks = [
  ["uv", "run", "--locked", "ruff", "check", "."],
  ["uv", "run", "--locked", "ruff", "format", "--check", "."],
  ["uv", "run", "--locked", "mypy"],
  ["uv", "run", "--locked", "pytest", "-q"],
]
