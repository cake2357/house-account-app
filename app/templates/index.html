{% extends "base.html" %}
{% block head %}<script src="/static/index.js" defer></script>{% endblock %}
{% block content %}
  <section class="page-heading">
    <div>
      <p class="eyebrow">RECEIPTS</p>
      <h1>レシート一覧</h1>
      <p class="muted">画像を登録して、商品名とタグを確認します。</p>
    </div>
  </section>

  <form id="upload-form" class="upload-panel">
    <label class="file-picker" for="receipt-file">
      <span class="file-icon" aria-hidden="true">＋</span>
      <span class="file-picker-info"><strong>レシート画像を選ぶ</strong><small>JPEG / PNG・15MiBまで</small></span>
    </label>
    <input id="receipt-file" type="file" accept="image/jpeg,image/png,.jpg,.jpeg,.png" required>
    <button class="button button-primary" type="submit">登録する</button>
    <p id="upload-status" class="form-message" aria-live="polite"></p>
  </form>

  <section class="list-section" aria-labelledby="list-heading">
    <div class="section-heading">
      <h2 id="list-heading">登録済み</h2>
      <span id="receipt-count" class="muted"></span>
    </div>
    <div id="receipt-list" class="receipt-list" aria-live="polite"></div>
    <div id="empty-state" class="empty-state" hidden>
      <span aria-hidden="true">▧</span>
      <p>レシートはまだありません</p>
      <small>上のフォームから画像を登録してください。</small>
    </div>
    <nav class="pagination" aria-label="一覧ページ">
      <button id="previous-page" class="button button-secondary" type="button" disabled>前へ</button>
      <span id="page-indicator" class="muted"></span>
      <button id="next-page" class="button button-secondary" type="button" disabled>次へ</button>
    </nav>
  </section>
{% endblock %}
