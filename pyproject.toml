[project]
name = "house-account-app"
version = "0.1.0"
description = "ローカルOCRと手動確認によるレシート記録アプリ"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "ipykernel",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/house_account", "app"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["data", "notebooks", "artifacts", ".agents"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["."]
exclude = '(^|/)(\.venv|\.agents|data|notebooks|artifacts|build|dist)/'
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["paddleocr", "paddleocr.*"]
follow_imports = "skip"
ignore_missing_imports = true
