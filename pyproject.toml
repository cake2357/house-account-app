[project]
name = "my-template"
version = "0.1.0"
description = "機械学習アルゴリズム・システム開発用テンプレート"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "ipykernel",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["data", "notebooks", "artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["."]
exclude = '(^|/)(\.venv|data|notebooks|artifacts|build|dist)/'
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true
show_error_codes = true
